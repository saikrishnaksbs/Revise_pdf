name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest runners ship a pre-installed Android SDK (with licenses already
      # accepted) under $ANDROID_HOME; Gradle/AGP auto-downloads any missing platform
      # or build-tools version using it, since this runner has full internet access.

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run core unit tests
        run: ./gradlew :core:test --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: revise-pdf-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Keeps one rolling "latest" release so the APK always has the same download URL:
      # https://github.com/saikrishnaksbs/Revise_pdf/releases/latest/download/revise-pdf-debug.apk
      - name: Publish APK to the latest release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk revise-pdf-debug.apk
          notes="Debug APK built from ${GITHUB_SHA}. Download revise-pdf-debug.apk below and open it on your phone to install."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest revise-pdf-debug.apk --clobber
            gh release edit latest --notes "$notes"
          else
            gh release create latest revise-pdf-debug.apk \
              --title "Revise PDF — latest debug build" \
              --notes "$notes"
          fi
