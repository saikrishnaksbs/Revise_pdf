name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest runners ship a pre-installed Android SDK (with licenses already
      # accepted) under $ANDROID_HOME; Gradle/AGP auto-downloads any missing platform
      # or build-tools version using it, since this runner has full internet access.

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run core unit tests
        run: ./gradlew :core:test --stacktrace

      - name: Run app unit tests
        run: ./gradlew :app:testLiteDebugUnitTest --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
          if-no-files-found: ignore

      - name: Build debug APKs
        run: ./gradlew :app:assembleLiteDebug :app:assembleFullDebug --stacktrace

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: revise-pdf-debug-apks
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error

      # Keeps one rolling "latest" release so the APK always has the same download URL:
      # https://github.com/saikrishnaksbs/Revise_pdf/releases/latest/download/revise-pdf-debug.apk
      - name: Publish APK to the latest release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/lite/debug/app-lite-debug.apk revise-pdf-lite.apk
          cp app/build/outputs/apk/full/debug/app-full-debug.apk revise-pdf-full.apk
          notes="Built from ${GITHUB_SHA}."$'\n\n'
          notes+="- **revise-pdf-lite.apk** - the PDF revision app. Small download, no on-device AI."$'\n'
          notes+="- **revise-pdf-full.apk** - same app plus the Qwen-VL question generator. Much larger, and needs a GGUF model you supply yourself."$'\n\n'
          notes+="Install only one: they share an application id, so the second replaces the first."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest revise-pdf-lite.apk revise-pdf-full.apk --clobber
            gh release edit latest --notes "$notes"
          else
            gh release create latest revise-pdf-lite.apk revise-pdf-full.apk \
              --title "Revise PDF — latest debug build" \
              --notes "$notes"
          fi
